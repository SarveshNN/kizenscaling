<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; }
  body {
    --bg: #0A1F1B;
    --text: #F5F1E8;
    --muted: rgba(245,241,232,0.70);
    --headline: #F5F1E8;
    --headline-dim: rgba(245,241,232,0.55);
    --aqua: #5DCAA5;
    --sky: #85B7EB;
    --blob-a: rgba(15,110,86,0.45);
    --blob-b: rgba(24,95,165,0.35);
    --nav-bg: rgba(255,255,255,0.05);
    --nav-border: rgba(255,255,255,0.15);
    --video-a: #04342C;
    --video-b: #042C53;
    --cta-bg: #5DCAA5;
    --cta-text: #04342C;
    --cta-dot: #04342C;
    --line: rgba(245,241,232,0.28);
    --sun-op: 0;
    --moon-op: 1;
    --scrim: rgba(4,20,17,0.82);
    background: var(--bg);
    font-family: 'Instrument Sans', Helvetica, Arial, sans-serif;
    transition: background-color 200ms ease;
  }
  a { color: var(--aqua); text-decoration: none; }
  a:hover { color: var(--aqua); opacity: 0.85; }
  @keyframes kz-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes kz-rise { from { opacity: 0; transform: translateY(8px) scale(0.985); } to { opacity: 1; transform: none; } }
</style>
</helmet>

<div style="position: relative; min-height: 100dvh; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; padding: 104px 20px 28px; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Instrument Sans', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; transition: background-color 200ms ease, color 200ms ease;">

  <div aria-hidden="true" style="position: absolute; top: -14vh; left: -12vw; width: min(56vw, 520px); height: min(56vw, 520px); border-radius: 50%; background: var(--blob-a); filter: blur(70px); pointer-events: none; transition: background-color 200ms ease;"></div>
  <div aria-hidden="true" style="position: absolute; top: -10vh; right: -14vw; width: min(52vw, 480px); height: min(52vw, 480px); border-radius: 50%; background: var(--blob-b); filter: blur(70px); pointer-events: none; transition: background-color 200ms ease;"></div>

  <nav style="position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 40; width: calc(100% - 32px); max-width: 640px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 8px 7px 16px; border-radius: 999px; background: var(--nav-bg); border: 1px solid var(--nav-border); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transition: background-color 200ms ease, border-color 200ms ease;">
    <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; letter-spacing: -0.015em; color: var(--text); transition: color 200ms ease;">
      <span style="width: 7px; height: 7px; border-radius: 50%; background: var(--aqua); flex: none;"></span>
      Kizen Scaling
    </span>
    <span style="display: flex; align-items: center; gap: 6px;">
      <button type="button" aria-label="Toggle colour mode" onClick="{{ toggleTheme }}" style="position: relative; width: 34px; height: 34px; flex: none; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 999px; background: transparent; color: var(--text); cursor: pointer; transition: background-color 160ms ease, color 200ms ease;" style-hover="background: var(--nav-border);">
        <span style="position: absolute; width: 13px; height: 13px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 3px var(--nav-border); opacity: var(--sun-op); transition: opacity 200ms ease;"></span>
        <span style="position: absolute; width: 15px; height: 15px; border-radius: 50%; box-shadow: inset -4px 2px 0 0 currentColor; opacity: var(--moon-op); transition: opacity 200ms ease;"></span>
      </button>
      <a href="{{ calUrl }}" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; padding: 9px 16px; border-radius: 999px; background: var(--cta-bg); color: var(--cta-text); font-size: 13px; font-weight: 500; letter-spacing: -0.01em; white-space: nowrap; transition: background-color 200ms ease, color 200ms ease, transform 160ms ease;" style-hover="transform: translateY(-1px); color: var(--cta-text);">Book strategy call</a>
    </span>
  </nav>

  <div style="position: relative; z-index: 2; width: 100%; max-width: 540px; display: flex; flex-direction: column; align-items: center; gap: 0; text-align: center;">

    <span style="display: inline-flex; align-items: center; gap: 7px; padding: 6px 13px 6px 11px; border-radius: 999px; border: 1px solid var(--nav-border); background: var(--nav-bg); font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--aqua); transition: background-color 200ms ease, border-color 200ms ease;">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: var(--aqua); flex: none;"></span>
      For pool contractors
    </span>

    <h1 style="margin: 22px 0 0; font-size: clamp(32px, 7.2vw, 47px); font-weight: 500; line-height: 1.05; letter-spacing: -0.025em; color: var(--headline); text-wrap: balance; transition: color 200ms ease;">
      A homeowner at your table this season. <span style="color: var(--headline-dim); transition: color 200ms ease;">Or you don't pay.</span>
    </h1>

    <p style="margin: 16px 0 0; max-width: 430px; font-size: 15px; font-weight: 400; line-height: 1.55; color: var(--muted); text-wrap: pretty; transition: color 200ms ease;">
      We put <span style="color: var(--sky);">you</span> at the top of Google — the one place Angi can't touch.
    </p>

    <button type="button" ref="{{ videoRef }}" aria-label="Play the 3-minute breakdown" onClick="{{ openVideo }}" style="margin: 28px 0 0; width: 100%; max-width: 500px; aspect-ratio: 16 / 9; display: flex; align-items: center; justify-content: center; padding: 0; border: 1px solid var(--nav-border); border-radius: 16px; background: linear-gradient(145deg, var(--video-a) 0%, var(--video-b) 100%); cursor: pointer; overflow: hidden; transition: border-color 200ms ease, transform 200ms ease, box-shadow 200ms ease;" style-hover="transform: translateY(-2px); box-shadow: 0 18px 50px -24px rgba(93,202,165,0.55);">
      <span style="display: flex; align-items: center; justify-content: center; width: 62px; height: 62px; border-radius: 50%; background: var(--aqua); box-shadow: 0 0 0 10px rgba(93,202,165,0.14); transition: box-shadow 200ms ease;">
        <span style="width: 0; height: 0; margin-left: 4px; border-left: 16px solid #04342C; border-top: 10px solid transparent; border-bottom: 10px solid transparent;"></span>
      </span>
    </button>

    <div style="margin: 22px 0 0; width: 100%; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;">
      <a href="{{ calUrl }}" target="_blank" rel="noopener" style="flex: 1 1 230px; max-width: 260px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; gap: 9px; padding: 14px 22px; border-radius: 999px; border: 1px solid transparent; background: var(--cta-bg); color: var(--cta-text); font-size: 14px; font-weight: 500; letter-spacing: -0.01em; transition: background-color 200ms ease, color 200ms ease, transform 160ms ease;" style-hover="transform: translateY(-1px); color: var(--cta-text);">
        <span style="width: 7px; height: 7px; border-radius: 50%; background: var(--cta-dot); flex: none; transition: background-color 200ms ease;"></span>
        Book strategy call
      </a>
      <button type="button" onClick="{{ watchBreakdown }}" style="flex: 1 1 230px; max-width: 260px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; gap: 9px; padding: 14px 22px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--text); font-family: inherit; font-size: 14px; font-weight: 500; letter-spacing: -0.01em; cursor: pointer; transition: border-color 200ms ease, color 200ms ease, background-color 160ms ease;" style-hover="background: var(--nav-bg);">
        <span style="width: 0; height: 0; border-left: 10px solid var(--aqua); border-top: 6px solid transparent; border-bottom: 6px solid transparent; flex: none;"></span>
        Watch the 3-min breakdown
      </button>
    </div>

    <p style="margin: 18px 0 0; font-size: 12px; font-weight: 400; letter-spacing: -0.005em; color: var(--muted); transition: color 200ms ease;">15-minute call · No pitch deck · One contractor per area</p>
  </div>

  <p style="position: relative; z-index: 2; margin: 40px 0 0; font-size: 12px; color: var(--muted); text-align: center; transition: color 200ms ease;">© Kizen Scaling 2026</p>

  <sc-if value="{{ modalOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeVideo }}" style="position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center; padding: 20px; background: var(--scrim); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); animation: kz-fade 180ms ease both;">
      <div style="position: relative; width: 100%; max-width: 900px; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: #04342C; box-shadow: 0 40px 120px -40px rgba(0,0,0,0.8); animation: kz-rise 220ms ease both;">
        <iframe src="{{ videoSrc }}" title="Kizen Scaling breakdown" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen="true" style="width: 100%; height: 100%; border: 0; display: block;"></iframe>
      </div>
      <button type="button" aria-label="Close video" onClick="{{ closeVideo }}" style="position: absolute; top: 18px; right: 18px; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(245,241,232,0.25); border-radius: 999px; background: rgba(245,241,232,0.06); color: #F5F1E8; font-family: inherit; font-size: 17px; line-height: 1; cursor: pointer;" style-hover="background: rgba(245,241,232,0.16);">×</button>
    </div>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;defaultTheme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;'dark' | 'light'&quot;},&quot;videoId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;PLACEHOLDER_VIDEO_ID&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;calUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://cal.com/sarvesh/strategy-call&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const THEMES = {
  dark: {
    '--bg': '#0A1F1B',
    '--text': '#F5F1E8',
    '--muted': 'rgba(245,241,232,0.70)',
    '--headline': '#F5F1E8',
    '--headline-dim': 'rgba(245,241,232,0.55)',
    '--blob-a': 'rgba(15,110,86,0.45)',
    '--blob-b': 'rgba(24,95,165,0.35)',
    '--nav-bg': 'rgba(255,255,255,0.05)',
    '--nav-border': 'rgba(255,255,255,0.15)',
    '--video-a': '#04342C',
    '--video-b': '#042C53',
    '--cta-bg': '#5DCAA5',
    '--cta-text': '#04342C',
    '--cta-dot': '#04342C',
    '--line': 'rgba(245,241,232,0.28)',
    '--sun-op': '0',
    '--moon-op': '1',
    '--scrim': 'rgba(4,20,17,0.82)'
  },
  light: {
    '--bg': '#F1EFE8',
    '--text': '#4a4a48',
    '--muted': 'rgba(74,74,72,0.78)',
    '--headline': '#042C53',
    '--headline-dim': '#0F6E56',
    '--blob-a': 'rgba(184,229,214,0.45)',
    '--blob-b': 'rgba(168,207,234,0.50)',
    '--nav-bg': 'rgba(255,255,255,0.75)',
    '--nav-border': 'rgba(4,44,83,0.12)',
    '--video-a': '#0F3D33',
    '--video-b': '#042C53',
    '--cta-bg': '#042C53',
    '--cta-text': '#F1EFE8',
    '--cta-dot': '#5DCAA5',
    '--line': 'rgba(4,44,83,0.22)',
    '--sun-op': '1',
    '--moon-op': '0',
    '--scrim': 'rgba(4,44,83,0.55)'
  }
};

class Component extends DCLogic {
  state = { theme: 'dark', modalOpen: false };
  videoRef = React.createRef();

  componentDidMount() {
    const t = this.props.defaultTheme === 'light' ? 'light' : 'dark';
    this.setState({ theme: t });
    this.apply(t);
    this.onKey = (e) => { if (e.key === 'Escape') this.setState({ modalOpen: false }); };
    document.addEventListener('keydown', this.onKey);
  }

  componentWillUnmount() {
    document.removeEventListener('keydown', this.onKey);
  }

  apply(theme) {
    const vars = THEMES[theme] || THEMES.dark;
    Object.keys(vars).forEach((k) => document.body.style.setProperty(k, vars[k]));
  }

  renderVals() {
    const id = this.props.videoId ?? 'PLACEHOLDER_VIDEO_ID';
    return {
      modalOpen: this.state.modalOpen,
      calUrl: this.props.calUrl ?? 'https://cal.com/sarvesh/strategy-call',
      videoSrc: 'https://player.vimeo.com/video/' + id + '?autoplay=1&title=0&byline=0&portrait=0',
      videoRef: this.videoRef,
      toggleTheme: () => {
        const next = this.state.theme === 'dark' ? 'light' : 'dark';
        this.setState({ theme: next });
        this.apply(next);
      },
      openVideo: () => this.setState({ modalOpen: true }),
      closeVideo: () => this.setState({ modalOpen: false }),
      watchBreakdown: () => {
        const el = this.videoRef.current;
        if (el) {
          const y = el.getBoundingClientRect().top + window.scrollY - 140;
          window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
        }
        setTimeout(() => this.setState({ modalOpen: true }), 260);
      }
    };
  }
}

</script>
</body>
</html>
